name: Build and deploy package repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load package repository deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SATIS_SSH_PRIVATE_KEY }}

      - name: Build Composer repository
        run: |
          if [ -n "${SSH_AUTH_SOCK:-}" ]; then
            docker run --rm -v "$PWD:/build" -v "$SSH_AUTH_SOCK:/ssh-agent" -e SSH_AUTH_SOCK=/ssh-agent -e 'GIT_SSH_COMMAND=ssh -o StrictHostKeyChecking=accept-new' -w /build composer/satis:latest build satis.json public
          else
            docker run --rm -v "$PWD:/build" -w /build composer/satis:latest build satis.json public
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
