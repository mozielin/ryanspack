name: Build & Deploy Satis

on:
  push:
    branches: [main]
    paths:
      - satis.json
      - .github/workflows/pages.yml
  repository_dispatch:
    types: [package-released]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate release payload
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_PACKAGE: ${{ github.event.client_payload.package }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          php -r '
          $package = getenv("RELEASE_PACKAGE");
          $version = getenv("RELEASE_VERSION");
          $sha = getenv("RELEASE_SHA");

          if (! preg_match("#^mozielin/[a-z0-9._-]+$#", $package)
              || ! preg_match("/^v[0-9]+\\.[0-9]+\\.[0-9]+$/", $version)
              || ! preg_match("/^[0-9a-f]{40}$/", $sha)) {
              fwrite(STDERR, "ERROR: invalid release payload\n");
              exit(1);
          }

          $config = json_decode(file_get_contents("satis.json"), true, flags: JSON_THROW_ON_ERROR);
          $urls = array_column($config["repositories"] ?? [], "url");
          $expectedUrl = "https://github.com/{$package}.git";

          if (! in_array($expectedUrl, $urls, true)) {
              fwrite(STDERR, "ERROR: package is not configured in satis.json\n");
              exit(1);
          }
          '

      - name: Install Satis
        run: composer create-project composer/satis /tmp/satis --stability=dev --no-interaction --no-progress

      - name: Build index
        env:
          SATIS_GITHUB_TOKEN: ${{ secrets.SATIS_GITHUB_TOKEN }}
          COMPOSER_PROCESS_TIMEOUT: '0'
        run: |
          if [ -n "$SATIS_GITHUB_TOKEN" ]; then
            composer config --global --auth github-oauth.github.com "$SATIS_GITHUB_TOKEN"
          fi
          php /tmp/satis/bin/satis build satis.json public

      - name: Verify released package metadata
        if: github.event_name == 'repository_dispatch'
        env:
          RELEASE_PACKAGE: ${{ github.event.client_payload.package }}
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
          RELEASE_SHA: ${{ github.event.client_payload.sha }}
        run: |
          php -r '
          $package = getenv("RELEASE_PACKAGE");
          $version = getenv("RELEASE_VERSION");
          $sha = getenv("RELEASE_SHA");
          $path = "public/p2/{$package}.json";

          if (! is_file($path)) {
              fwrite(STDERR, "ERROR: missing {$path}\n");
              exit(1);
          }

          foreach (json_decode(file_get_contents($path), true, flags: JSON_THROW_ON_ERROR)["packages"][$package] ?? [] as $candidate) {
              if (($candidate["version"] ?? null) === $version
                  && ($candidate["source"]["reference"] ?? null) === $sha
                  && ($candidate["dist"]["reference"] ?? null) === $sha) {
                  exit(0);
              }
          }

          fwrite(STDERR, "ERROR: {$package} {$version} is missing or has a reference mismatch\n");
          exit(1);
          '

      - name: Show index size
        run: du -sh public && ls public

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
